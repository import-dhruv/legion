services:
  - type: web
    name: legion-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    context: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: CONTROL_PLANE_TOKEN
        sync: false
      - key: DATABASE_URL
        value: sqlite:////tmp/aise-legion.db
      - key: REDIS_ENABLED
        value: false
      - key: SANDBOX_MODE
        value: local
      - key: WORKSPACE_ROOT
        value: /tmp/aise-legion-workspaces
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
