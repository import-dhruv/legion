services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aise
      POSTGRES_PASSWORD: aise
      POSTGRES_DB: aise
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aise"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aise:aise@postgres:5432/aise
      REDIS_URL: redis://redis:6379/0
      SANDBOX_MODE: local
      WORKSPACE_ROOT: /workspaces
    ports: ["3001:8000"]
    volumes:
      - workspaces:/workspaces
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports: ["3000:3000"]
    depends_on: [backend]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3002:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  pgdata:
  workspaces:
